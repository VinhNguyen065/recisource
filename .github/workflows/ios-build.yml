name: iOS build (21 + HealthKit)

# Runs on GitHub's free cloud Macs — no Mac needed on your side.
# Trigger it manually: repo → Actions → "iOS build (21 + HealthKit)" → Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor + HealthKit plugin
        working-directory: app-store-package
        run: npm install

      - name: Create iOS project
        working-directory: app-store-package
        run: npx cap add ios

      - name: Copy web app into iOS shell
        working-directory: app-store-package
        run: npx cap sync ios

      - name: Configure HealthKit (Info.plist + entitlements)
        working-directory: app-store-package
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSHealthShareUsageDescription string 21 reads your steps, heart rate and sleep from Apple Health so your dashboard fills in automatically. You can always enter values manually instead." "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSHealthUpdateUsageDescription string 21 does not write to Apple Health today; this permission is reserved for future features." "$PLIST"
          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.healthkit</key>
            <true/>
          </dict>
          </plist>
          EOF
          # point the Xcode project at the entitlements file
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com.recisource.app;/PRODUCT_BUNDLE_IDENTIFIER = com.recisource.app; CODE_SIGN_ENTITLEMENTS = App\/App.entitlements;/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Compile check (unsigned — proves the app builds)
        working-directory: app-store-package/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build | tail -40

      - name: Upload ready-to-sign Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: ios-project-21
          path: app-store-package/ios
          retention-days: 30

# To get a SIGNED build onto your iPhone you need an Apple Developer account
# ($99/yr). Easiest path from Windows once you have it: codemagic.io (free tier,
# ~500 Mac minutes/month) — connect this GitHub repo, add your App Store Connect
# API key in their UI, and it signs + uploads to TestFlight for you. This
# workflow's artifact is the same project Codemagic builds.
