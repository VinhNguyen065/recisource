# 21again - cloud iOS build & TestFlight upload (NO MAC NEEDED)
#
# This file lives at the REPO ROOT because that is the only place Codemagic
# reads it from. The Capacitor project is in app-store-package/, which
# working_directory below points at, so script paths stay relative to it.
#
# BRANCH NOTE: build this branch (full-source). It is the one Code pushes the
# current www/index.html to; main's copy is older and lacks the Apple Health
# auto-sync on launch and the 5-minute re-sync timer.
#
# SIGNING NOTE: do NOT add an ios_signing: block here. That only FETCHES
# existing signing files and fails on a fresh Apple account with
# "No matching profiles found for bundle identifier ... app_store".
# The "Create or fetch iOS signing files" step below uses --create, which
# mints the distribution certificate and a profile carrying the HealthKit
# entitlement.
workflows:
  ios-release:
    name: 21again iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: app-store-package
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.recisource.app"
      node: 18.17.0
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: APP_STORE_CONNECT
    scripts:
      - name: Install JS dependencies
        script: |
          npm install
      - name: Add and sync the iOS project (Capacitor)
        script: |
          if [ ! -d "ios" ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Confirm the HealthKit plugin is linked
        script: |
          grep -qi "healthkit" ios/App/Podfile || { echo "ERROR: HealthKit pod missing"; exit 1; }
          echo "HealthKit plugin is linked."
      - name: Confirm the web build has the Health bridge
        script: |
          W="www/index.html"
          grep -q "CapacitorHealthkit" "$W" || { echo "ERROR: no HealthKit bridge in $W"; exit 1; }
          grep -q "queryHKitSampleType" "$W" || { echo "ERROR: no HealthKit queries in $W"; exit 1; }
          echo "Health bridge present."
      - name: Inject Info.plist usage descriptions
        script: |
          PLIST="ios/App/App/Info.plist"
          set_key () {
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST"
          }
          set_key NSCameraUsageDescription "21again uses the camera to scan meals for calorie counting and to import recipes from photos."
          set_key NSPhotoLibraryUsageDescription "21again lets you pick photos of meals or cookbook pages to analyse."
          set_key NSMicrophoneUsageDescription "21again listens for claps and spoken commands to control hands-free workout timers."
          set_key NSMotionUsageDescription "21again uses motion to count your steps and reps during workouts."
          set_key NSHealthShareUsageDescription "21again reads heart rate, sleep and steps from Apple Health to power your Today dashboard."
          set_key NSHealthUpdateUsageDescription "21again saves workouts and nutrition you log back to Apple Health."
          /usr/libexec/PlistBuddy -c "Print :NSHealthShareUsageDescription" "$PLIST"
      - name: Inject the HealthKit entitlement
        script: |
          ENT="ios/App/App/App.entitlements"
          cat > "$ENT" <<'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.healthkit</key>
            <true/>
            <key>com.apple.developer.healthkit.access</key>
            <array/>
          </dict>
          </plist>
          PLIST_EOF
          plutil -lint "$ENT"
          ruby <<'RUBY_EOF'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = proj.targets.find { |t| t.name == 'App' } or abort('ERROR: App target not found')
          begin
            grp = proj.main_group.find_subpath('App', true)
            unless grp.files.any? { |f| f.display_name == 'App.entitlements' }
              grp.new_file('App.entitlements')
            end
          rescue => e
            puts 'note: could not add file reference (cosmetic only)'
          end
          target.build_configurations.each do |c|
            c.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
          end
          proj.save
          puts 'CODE_SIGN_ENTITLEMENTS set'
          RUBY_EOF
      - name: Create or fetch iOS signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
      - name: Set version and build number
        script: |
          cd ios/App
          VER=$(node -p "require('../../package.json').version")
          agvtool new-marketing-version "$VER" || true
          agvtool new-version -all "$PROJECT_BUILD_NUMBER" || true
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Set up signing
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
