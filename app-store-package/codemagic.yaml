# 21again — cloud iOS build & TestFlight upload (NO MAC NEEDED)
#
# This file lives at the REPO ROOT because that is the only place Codemagic
# reads it from. The actual Capacitor project is in app-store-package/, which
# `working_directory` below points at — so every script path stays relative
# to that folder.
#
# ── One-time setup ────────────────────────────────────────────────────────
# 1. developer.apple.com → Certificates, Identifiers & Profiles → Identifiers
#    → + → App IDs → App → explicit Bundle ID `com.recisource.app`
#    → TICK "HealthKit" → Register.
#    DO THIS BEFORE THE FIRST BUILD. This workflow injects the HealthKit
#    entitlement; if the App ID lacks the capability, signing fails with
#    "Provisioning profile doesn't include the com.apple.developer.healthkit
#    entitlement".
# 2. App Store Connect → Users and Access → Integrations → App Store Connect
#    → create an API key (App Manager or Admin). Keep the .p8, Key ID, Issuer ID.
# 3. Codemagic → this app → Settings:
#      • Add an App Store Connect integration named exactly APP_STORE_CONNECT
#      • Code signing (iOS) → Automatic, using that same API key
#    No environment-variable groups are needed.
# 4. App Store Connect → Apps → + → new app: bundle ID com.recisource.app.
# ──────────────────────────────────────────────────────────────────────────
workflows:
  ios-release:
    name: 21again iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: app-store-package
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.recisource.app"
      node: 18.17.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.recisource.app
    integrations:
      app_store_connect: APP_STORE_CONNECT
    scripts:
      - name: Install JS dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Add & sync the iOS project (Capacitor)
        script: |
          if [ ! -d "ios" ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Confirm the HealthKit plugin is linked
        script: |
          # Fail early and loudly rather than shipping a build where Apple
          # Health silently does nothing.
          grep -qi "healthkit" ios/App/Podfile \
            || { echo "ERROR: HealthKit pod missing from ios/App/Podfile - check package.json"; exit 1; }
          echo "HealthKit plugin is linked."
      - name: Patch the HealthKit plugin (sleep stages + period tracking)
        script: |
          # The published plugin collapses every sleep sample to "Asleep" and has no
          # menstrual-flow support. Patch its Swift source in node_modules before the
          # pods are installed. Every anchor is asserted so a plugin update fails loudly
          # here instead of silently shipping a build without stages or cycle import.
          SW="node_modules/@perfood/capacitor-healthkit/ios/Plugin/CapacitorHealthkitPlugin.swift"
          test -f "$SW" || { echo "ERROR: plugin Swift source not found at $SW"; exit 1; }
          python3 - "$SW" <<'PY'
          import io, sys
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8').read()
          def swap(old, new, label):
              global s
              n = s.count(old)
              assert n == 1, 'anchor %s found %d times' % (label, n)
              s = s.replace(old, new)
              print('patched: ' + label)
          swap('let sleepState = (sample.value == HKCategoryValueSleepAnalysis.inBed.rawValue) ? "InBed" : "Asleep"',
               'let sleepNames = ["InBed", "Asleep", "Awake", "Core", "Deep", "REM"]\n                let sleepState = (sample.value >= 0 && sample.value < sleepNames.count) ? sleepNames[sample.value] : "Asleep"',
               'sleep stages')
          swap('        case "stepCount":',
               '        case "menstrualFlow":\n            return HKObjectType.categoryType(forIdentifier: HKCategoryTypeIdentifier.menstrualFlow)!\n        case "stepCount":',
               'menstrualFlow sample type')
          swap('            case "steps":',
               '            case "cycle":\n                types.insert(HKObjectType.categoryType(forIdentifier: HKCategoryTypeIdentifier.menstrualFlow)!)\n            case "steps":',
               'cycle permission')
          swap('            if sampleName == "sleepAnalysis" {',
               '            if sampleName == "menstrualFlow" {\n                guard let sample = result as? HKCategorySample else {\n                    return nil\n                }\n                let flowNames = ["Unspecified", "Unspecified", "Light", "Medium", "Heavy", "None"]\n                let constructedSample: [String: Any] = [\n                    "uuid": sample.uuid.uuidString,\n                    "startDate": ISO8601DateFormatter().string(from: sample.startDate),\n                    "endDate": ISO8601DateFormatter().string(from: sample.endDate),\n                    "value": sample.value,\n                    "flow": (sample.value >= 0 && sample.value < flowNames.count) ? flowNames[sample.value] : "Unspecified",\n                    "source": sample.sourceRevision.source.name,\n                    "sourceBundleId": sample.sourceRevision.source.bundleIdentifier,\n                    "device": getDeviceInformation(device: sample.device),\n                ]\n                output.append(constructedSample)\n                continue\n            }\n            if sampleName == "sleepAnalysis" {',
               'menstrualFlow output')
          io.open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -c "sleepNames\|menstrualFlow" "$SW"
      - name: Inject Info.plist usage descriptions (required - prevents launch crash)
        script: |
          PLIST="ios/App/App/Info.plist"
          set_key () {
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST"
          }
          set_key NSCameraUsageDescription "21again uses the camera to scan meals for calorie counting, to import recipes from photos, and to measure your pulse."
          set_key NSPhotoLibraryUsageDescription "21again lets you pick photos of meals or cookbook pages to analyse."
          set_key NSMicrophoneUsageDescription "21again listens for claps and spoken commands to control hands-free workout timers."
          set_key NSMotionUsageDescription "21again uses motion to count your steps automatically and to count reps during workouts."
          set_key NSHealthShareUsageDescription "21again reads heart rate, sleep and steps from Apple Health to power your Today dashboard."
          set_key NSHealthUpdateUsageDescription "21again saves workouts and nutrition you log back to Apple Health."
          # Export compliance: the app uses only standard HTTPS/TLS, so TestFlight must not wait for a manual answer.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST"
          # URL scheme used by the Share Extension (and any "open in 21again" link)
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.recisource.app" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string twentyone" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSHealthShareUsageDescription" "$PLIST"
      - name: Inject the HealthKit entitlement
        script: |
          # Capacitor generates NO entitlements file. Without this, iOS never
          # shows the Health permission sheet and requestAuthorization() fails.
          ENT="ios/App/App/App.entitlements"
          cat > "$ENT" <<'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.healthkit</key>
            <true/>
            <key>com.apple.developer.healthkit.access</key>
            <array/>
          </dict>
          </plist>
          PLIST_EOF
          plutil -lint "$ENT"
          ruby <<'RUBY_EOF'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = proj.targets.find { |t| t.name == 'App' } or abort('ERROR: target "App" not found')
          begin
            grp = proj.main_group.find_subpath('App', true)
            unless grp.files.any? { |f| f.display_name == 'App.entitlements' }
              grp.new_file('App.entitlements')
            end
          rescue => e
            puts "note: could not add file reference (cosmetic only): #{e}"
          end
          target.build_configurations.each do |c|
            c.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
          end
          proj.save
          puts 'CODE_SIGN_ENTITLEMENTS set to App/App.entitlements'
          RUBY_EOF
      - name: Set version & build number
        script: |
          cd ios/App
          VER=$(node -p "require('../../package.json').version")
          agvtool new-marketing-version "$VER" || true
          agvtool new-version -all "$PROJECT_BUILD_NUMBER" || true
      - name: Add the Share Extension (share links from Facebook, TikTok, YouTube straight into 21again)
        script: |
          # The automatic signing step only fetches a profile for the main bundle id. Reuse its
          # distribution certificate to create/fetch a profile for the extension's bundle id via the
          # App Store Connect API, then add the extension target. If anything in that chain fails,
          # build WITHOUT the extension rather than failing the whole build.
          set +e
          KEY=/tmp/dist_key.pem; OK=0
          P12=$(ls "$HOME/Library/MobileDevice/Certificates/"* 2>/dev/null | head -1)
          echo "certificate file: ${P12:-none}"
          if [ -n "$P12" ]; then
            file "$P12"; head -c 40 "$P12" | od -c | head -3
            # a) PEM bundle that already contains the private key
            if grep -q "PRIVATE KEY" "$P12"; then
              sed -n '/-----BEGIN [A-Z ]*PRIVATE KEY-----/,/-----END [A-Z ]*PRIVATE KEY-----/p' "$P12" > "$KEY"
              [ -s "$KEY" ] && OK=1
            fi
            # b) PKCS12 with an empty/known password
            if [ "$OK" = "0" ]; then
              for pw in "" "codemagic" "password"; do
                openssl pkcs12 -in "$P12" -nocerts -nodes -passin "pass:$pw" -out "$KEY" 2>/dev/null && [ -s "$KEY" ] && OK=1 && break
                openssl pkcs12 -legacy -in "$P12" -nocerts -nodes -passin "pass:$pw" -out "$KEY" 2>/dev/null && [ -s "$KEY" ] && OK=1 && break
              done
            fi
            # c) DER-encoded PKCS8/RSA key
            if [ "$OK" = "0" ]; then
              openssl pkey -inform DER -in "$P12" -out "$KEY" 2>/dev/null && [ -s "$KEY" ] && OK=1
            fi
          fi
          echo "certificate key extracted: $OK"
          if [ "$OK" = "1" ]; then
            app-store-connect fetch-signing-files "com.recisource.app.share" --type IOS_APP_STORE --create \
              --certificate-key="@file:$KEY" --profiles-dir "$HOME/Library/MobileDevice/Provisioning Profiles" && OK=2
          fi
          : > "$KEY"
          if [ "$OK" = "2" ]; then
            set -e
            ruby ios-extras/add_share_extension.rb
            APLIST="ios/App/App/Info.plist"; EPLIST="ios/App/ShareExtension/Info.plist"
            V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APLIST")
            B=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APLIST")
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$EPLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $B" "$EPLIST"
            echo "Share Extension added, version $V ($B)"
            ls "$HOME/Library/MobileDevice/Provisioning Profiles"
          else
            echo "WARNING: no provisioning profile for com.recisource.app.share - building WITHOUT the Share Extension this time."
          fi

      - name: Raise the iOS floor to 15.0 (App Store Connect refuses lower from spring 2027)
        script: |
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          if [ -f ios/App/Podfile ]; then sed -i '' -E "s/platform :ios, '[0-9.]+'/platform :ios, '15.0'/" ios/App/Podfile; fi
          echo "deployment targets now: $(grep -c 'IPHONEOS_DEPLOYMENT_TARGET = 15.0' ios/App/App.xcodeproj/project.pbxproj)"
          grep -n "platform :ios" ios/App/Podfile || true
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Set up signing
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false   # flip to true when ready for public review
